name: settlement-recon-s3-test
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: recon-local-test
      MINIO_ROOT_PASSWORD: ${MINIO_TEST_PASSWORD:?Set generated MINIO_TEST_PASSWORD}
      MINIO_KMS_SECRET_KEY: ${MINIO_TEST_KMS_KEY:?Set generated MINIO_TEST_KMS_KEY}
    ports: ["127.0.0.1:9011:9000"]
    mem_limit: 512m
    volumes: ["s3:/data"]
volumes:
  s3:
