[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "settlement-recon"
version = "0.1.0"
description = "Auditable payment reconciliation with replay-safe ingestion"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
settlement-recon = "settlement_recon.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
settlement_recon = ["*.html", "*.css", "*.js", "assets/*.ttf", "assets/*OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

